<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Responsive Sizing and Spacing</title>
  </head>

  <body
    class="min-h-screen bg-slate-950 px-4 py-10 text-white sm:px-6 lg:px-8 lg:py-20"
  >
    <main class="mx-auto max-w-7xl">
      <section class="rounded-2xl bg-slate-900 p-5 sm:p-8 lg:p-12">
        <p class="font-semibold text-blue-400">Responsive Spacing</p>

        <h1
          class="mt-3 max-w-4xl text-3xl font-bold tracking-tight sm:text-4xl lg:text-6xl"
        >
          More space can support larger visual scale
        </h1>

        <p
          class="mt-5 max-w-2xl text-base leading-7 text-slate-300 lg:mt-6 lg:text-lg lg:leading-8"
        >
          Mobile layouts usually need tighter spacing while larger layouts can
          use more breathing room.
        </p>

        <button
          class="mt-8 w-full rounded-lg bg-blue-600 px-5 py-3 font-semibold sm:w-auto lg:mt-10"
        >
          Start Building
        </button>
      </section>

      <section
        class="mt-10 grid grid-cols-2 gap-3 sm:mt-14 sm:gap-5 lg:mt-20 lg:grid-cols-4 lg:gap-8"
      >
        <div class="rounded-xl bg-slate-900 p-4 sm:p-6">1</div>
        <div class="rounded-xl bg-slate-900 p-4 sm:p-6">2</div>
        <div class="rounded-xl bg-slate-900 p-4 sm:p-6">3</div>
        <div class="rounded-xl bg-slate-900 p-4 sm:p-6">4</div>
      </section>
    </main>
  </body>
</html>
