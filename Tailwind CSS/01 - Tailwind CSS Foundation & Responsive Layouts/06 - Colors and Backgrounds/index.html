<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Colors and Backgrounds</title>
  </head>

  <body class="min-h-screen bg-slate-950 p-6 text-white">
    <main class="mx-auto max-w-5xl">
      <h1 class="text-3xl font-bold">Colors and Backgrounds</h1>

      <div class="mt-8 grid grid-cols-3 gap-4">
        <div class="rounded-xl bg-blue-600 p-6">Blue</div>

        <div class="rounded-xl bg-emerald-500 p-6">Emerald</div>

        <div class="rounded-xl bg-rose-500 p-6">Rose</div>
      </div>

      <article class="mt-8 rounded-2xl bg-white p-6">
        <h2 class="text-2xl font-bold text-slate-950">Strong Heading</h2>

        <p class="mt-2 text-slate-600">
          Supporting content uses lower contrast.
        </p>

        <span
          class="mt-5 inline-block rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-700"
        >
          New
        </span>
      </article>

      <!-- Slash syntax controls color opacity. -->
      <div class="mt-8 rounded-xl bg-blue-500/20 p-5 text-blue-200">
        Transparent blue background
      </div>

      <!-- Gradient utilities. -->
      <div
        class="mt-8 rounded-2xl bg-linear-to-r from-blue-600 via-purple-600 to-pink-600 p-10"
      >
        Gradient Background
      </div>
    </main>
  </body>
</html>
