<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Spacing System</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-4xl">
      <!-- p-8 adds padding to all sides. -->

      <section class="rounded-2xl bg-white p-8">
        <h1 class="text-3xl font-bold">Spacing System</h1>

        <!-- mt-3 adds margin-top. -->
        <p class="mt-3 text-slate-600">
          Tailwind uses a consistent spacing scale.
        </p>

        <!-- gap controls spacing between flex children. -->
        <div class="mt-6 flex gap-4">
          <button class="rounded-lg bg-blue-600 px-5 py-3 text-white">
            Primary
          </button>

          <button class="rounded-lg border border-slate-300 px-5 py-3">
            Secondary
          </button>
        </div>

        <!-- space-y adds spacing between direct children. -->
        <div class="mt-8 space-y-4">
          <div class="rounded-lg bg-slate-100 p-4">First Item</div>

          <div class="rounded-lg bg-slate-100 p-4">Second Item</div>

          <div class="rounded-lg bg-slate-100 p-4">Third Item</div>
        </div>
      </section>
    </main>

    <!--
      Padding:

      p-4
      px-4
      py-4
      pt-4
      pr-4
      pb-4
      pl-4

      Margin:

      m-4
      mx-auto
      mt-4
      mb-4

      Layout spacing:

      gap-4
      gap-x-6
      gap-y-4
      space-y-4
    -->
  </body>
</html>
