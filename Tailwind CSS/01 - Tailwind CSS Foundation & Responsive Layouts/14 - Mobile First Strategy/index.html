<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Mobile First Strategy</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-4 md:p-8">
    <main class="mx-auto max-w-5xl">
      <!--
        Base styles are mobile styles.

        Mobile:
        content is stacked.

        md and larger:
        content becomes horizontal.
      -->

      <article class="overflow-hidden rounded-2xl bg-white shadow-lg md:flex">
        <div
          class="h-56 bg-linear-to-br from-blue-500 to-purple-700 md:h-auto md:w-2/5 md:shrink-0"
        ></div>

        <div class="p-5 sm:p-6 lg:p-10">
          <p class="font-semibold text-blue-600">Mobile First</p>

          <h1
            class="mt-3 text-2xl font-bold tracking-tight sm:text-3xl lg:text-4xl"
          >
            Start with the smallest layout
          </h1>

          <p class="mt-4 leading-7 text-slate-600">
            Add more complex layout behavior only when the available space
            supports it.
          </p>

          <button
            class="mt-6 w-full rounded-lg bg-blue-600 px-5 py-3 text-white sm:w-auto"
          >
            Learn More
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
