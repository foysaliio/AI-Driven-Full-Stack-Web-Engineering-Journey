<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Responsive Flex Layouts</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-4 md:p-8">
    <main class="mx-auto max-w-6xl space-y-10">
      <!-- Responsive navigation. -->

      <nav
        class="flex flex-col gap-5 rounded-2xl bg-white p-5 md:flex-row md:items-center md:justify-between"
      >
        <div class="flex items-center justify-between">
          <h1 class="text-xl font-bold">DevSpace</h1>

          <button
            class="rounded-lg border border-slate-300 px-3 py-2 md:hidden"
          >
            Menu
          </button>
        </div>

        <div class="flex flex-col gap-3 md:flex-row md:items-center md:gap-6">
          <a href="#">Home</a>
          <a href="#">Projects</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>

        <button
          class="w-full rounded-lg bg-blue-600 px-5 py-3 text-white md:w-auto"
        >
          Hire Me
        </button>
      </nav>

      <!-- Responsive hero. -->

      <section
        class="flex flex-col gap-8 rounded-2xl bg-white p-6 lg:flex-row lg:items-center lg:gap-12 lg:p-10"
      >
        <div class="flex-1">
          <p class="font-semibold text-blue-600">Frontend Engineering</p>

          <h2 class="mt-3 text-4xl font-bold lg:text-5xl">
            Responsive Flex Layout
          </h2>

          <p class="mt-4 max-w-xl leading-7 text-slate-600">
            Stack content vertically first and move it into a row when enough
            horizontal space becomes available.
          </p>

          <div class="mt-6 flex flex-col gap-3 sm:flex-row">
            <button class="rounded-lg bg-blue-600 px-5 py-3 text-white">
              Projects
            </button>

            <button class="rounded-lg border border-slate-300 px-5 py-3">
              Contact
            </button>
          </div>
        </div>

        <div
          class="aspect-square w-full rounded-2xl bg-linear-to-br from-cyan-500 to-blue-700 lg:w-2/5 lg:shrink-0"
        ></div>
      </section>
    </main>
  </body>
</html>
