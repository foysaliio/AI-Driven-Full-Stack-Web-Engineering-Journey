<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Flexbox</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-6xl space-y-10">
      <!-- Basic navbar. -->
      <nav
        class="flex items-center justify-between rounded-xl bg-white p-5 shadow-sm"
      >
        <h1 class="text-xl font-bold">DevSpace</h1>

        <div class="flex items-center gap-6">
          <a href="#">Home</a>
          <a href="#">Projects</a>
          <a href="#">Contact</a>
        </div>

        <button class="rounded-lg bg-blue-600 px-4 py-2 text-white">
          Login
        </button>
      </nav>

      <!-- Vertical flex direction. -->
      <section class="flex flex-col gap-4 rounded-xl bg-white p-6">
        <div class="rounded-lg bg-slate-100 p-4">Item 1</div>

        <div class="rounded-lg bg-slate-100 p-4">Item 2</div>
      </section>

      <!-- Fixed sidebar + flexible content. -->
      <section class="flex gap-6">
        <aside class="w-64 shrink-0 rounded-xl bg-slate-900 p-6 text-white">
          Sidebar
        </aside>

        <article class="min-w-0 flex-1 rounded-xl bg-white p-6">
          <h2 class="text-2xl font-bold">Main Content</h2>

          <p class="mt-2 text-slate-600">
            flex-1 takes the remaining available space.
          </p>
        </article>
      </section>

      <!-- Wrapping flex items. -->
      <div class="flex flex-wrap gap-3">
        <span class="rounded-full bg-blue-100 px-4 py-2">HTML</span>
        <span class="rounded-full bg-blue-100 px-4 py-2">CSS</span>
        <span class="rounded-full bg-blue-100 px-4 py-2">JavaScript</span>
        <span class="rounded-full bg-blue-100 px-4 py-2">TypeScript</span>
        <span class="rounded-full bg-blue-100 px-4 py-2">React</span>
      </div>
    </main>
  </body>
</html>
