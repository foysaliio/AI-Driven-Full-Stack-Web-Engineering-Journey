<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>What is Tailwind CSS</title>
  </head>

  <body class="min-h-screen bg-slate-950 p-6 text-white">
    <!-- Tailwind styles HTML using small utility classes. -->

    <main class="mx-auto max-w-4xl">
      <section class="rounded-2xl bg-slate-900 p-8 shadow-2xl">
        <p class="text-sm font-semibold uppercase tracking-wider text-blue-400">
          Tailwind CSS
        </p>

        <h1 class="mt-3 text-4xl font-bold tracking-tight">
          Utility-first CSS framework
        </h1>

        <p class="mt-4 max-w-2xl leading-7 text-slate-300">
          Tailwind provides small utility classes that let us build complete
          designs directly inside our HTML.
        </p>

        <button
          class="mt-6 rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white"
        >
          Get Started
        </button>
      </section>
    </main>

    <!--
      Traditional CSS:

      .card {
        padding: 2rem;
        border-radius: 1rem;
        background-color: ...;
      }

      Tailwind:

      p-8
      rounded-2xl
      bg-slate-900
    -->
  </body>
</html>
