<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --animate-fade-up: fade-up 0.5s ease-out;

        @keyframes fade-up {
          from {
            opacity: 0;
            transform: translateY(20px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>

    <title>Animations</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-4xl">
      <h1 class="text-3xl font-bold">Animation Utilities</h1>

      <div class="mt-10 flex flex-wrap items-center gap-10">
        <div
          class="size-12 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"
        ></div>

        <div class="relative size-5">
          <span
            class="absolute inset-0 animate-ping rounded-full bg-blue-500"
          ></span>

          <span class="relative block size-5 rounded-full bg-blue-600"></span>
        </div>

        <div class="rounded-xl bg-white p-6 shadow-md animate-pulse">
          Loading Card
        </div>
      </div>

      <!-- Custom animation created with @theme. -->
      <article
        class="mt-12 max-w-md animate-fade-up rounded-2xl bg-slate-900 p-6 text-white"
      >
        <h2 class="text-xl font-bold">Custom Fade Up</h2>

        <p class="mt-2 text-slate-300">
          Custom animations can become normal Tailwind utilities.
        </p>
      </article>
    </main>
  </body>
</html>
