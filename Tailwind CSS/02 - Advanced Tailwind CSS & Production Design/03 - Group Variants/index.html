<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Group Variants</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-4xl">
      <!-- The parent receives the group marker. -->
      <article
        class="group max-w-md cursor-pointer rounded-2xl border border-slate-200 bg-white p-6 transition duration-300 hover:-translate-y-1 hover:shadow-xl"
      >
        <div
          class="grid size-12 place-items-center rounded-xl bg-blue-100 text-xl transition group-hover:bg-blue-600 group-hover:text-white"
        >
          &lt;/&gt;
        </div>

        <!-- Child reacts to parent hover. -->
        <h2
          class="mt-5 text-2xl font-bold text-slate-900 transition-colors group-hover:text-blue-600"
        >
          Frontend Engineering
        </h2>

        <p class="mt-3 leading-7 text-slate-600">
          Hover anywhere on the card and multiple child elements react.
        </p>

        <span
          class="mt-6 inline-block font-semibold text-blue-600 transition-transform group-hover:translate-x-2"
        >
          Explore →
        </span>
      </article>
    </main>
  </body>
</html>
