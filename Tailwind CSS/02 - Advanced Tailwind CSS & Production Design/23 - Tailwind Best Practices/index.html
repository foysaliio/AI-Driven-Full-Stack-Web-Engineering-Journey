<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Tailwind Best Practices</title>
  </head>

  <body class="min-h-screen bg-slate-100 px-4 py-10 sm:px-6 lg:px-8">
    <!--
      BEST PRACTICE 1:
      Control the page width.
    -->

    <main class="mx-auto max-w-7xl">
      <!--
        BEST PRACTICE 2:
        Build mobile first.
      -->

      <section class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3">
        <!--
          BEST PRACTICE 3:
          Use consistent spacing and design values.
        -->

        <article
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <h2 class="text-xl font-bold">Consistent Card</h2>

          <p class="mt-3 leading-7 text-slate-600">
            Use the design scale whenever it already solves the problem.
          </p>

          <!--
            BEST PRACTICE 4:
            Use arbitrary values only when the value is genuinely unique.
          -->

          <div class="mt-6 h-[3px] w-16 rounded-full bg-blue-600"></div>
        </article>

        <article
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <h2 class="text-xl font-bold">Intentional Layout</h2>

          <!--
            BEST PRACTICE 5:
            Prefer gap for layout spacing.
          -->

          <div class="mt-5 flex flex-wrap gap-3">
            <span class="rounded-full bg-blue-100 px-3 py-1"> React </span>

            <span class="rounded-full bg-blue-100 px-3 py-1"> Tailwind </span>
          </div>
        </article>

        <article
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <h2 class="text-xl font-bold">Accessible Interaction</h2>

          <button
            class="mt-5 rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition-colors hover:bg-blue-700 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-blue-600"
          >
            Action
          </button>
        </article>
      </section>
    </main>
  </body>
</html>
