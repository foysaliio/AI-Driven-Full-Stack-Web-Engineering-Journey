<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-brand-50: #eff6ff;
        --color-brand-500: #2563eb;
        --color-brand-700: #1d4ed8;

        --font-display: Georgia, serif;

        --radius-card: 1.5rem;

        --shadow-card: 0 20px 40px rgb(15 23 42 / 0.12);

        --breakpoint-3xl: 120rem;
      }
    </style>

    <title>Theme Customization</title>
  </head>

  <body class="min-h-screen bg-brand-50 p-6">
    <main class="mx-auto max-w-5xl">
      <article class="rounded-card bg-white p-8 shadow-card">
        <p class="font-semibold text-brand-500">Custom Theme</p>

        <h1
          class="mt-3 font-display text-4xl font-bold text-slate-950 3xl:text-7xl"
        >
          Tailwind Theme Variables
        </h1>

        <button
          class="mt-6 rounded-lg bg-brand-500 px-5 py-3 font-semibold text-white hover:bg-brand-700"
        >
          Continue
        </button>
      </article>
    </main>
  </body>
</html>
