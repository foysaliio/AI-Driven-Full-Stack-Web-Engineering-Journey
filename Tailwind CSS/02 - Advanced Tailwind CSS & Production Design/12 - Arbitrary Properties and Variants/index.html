<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Arbitrary Properties and Variants</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-4xl">
      <!-- Arbitrary CSS property. -->
      <div class="[--card-gap:2rem] rounded-2xl bg-white p-6 shadow-lg">
        <div class="flex gap-[var(--card-gap)]">
          <div class="rounded-lg bg-blue-100 p-4">A</div>
          <div class="rounded-lg bg-blue-100 p-4">B</div>
        </div>
      </div>

      <!-- Arbitrary selector variant. -->
      <article
        class="mt-8 rounded-2xl bg-white p-6 [&_a]:font-semibold [&_a]:text-blue-600 [&_p]:mt-4 [&_p]:leading-7 [&_p]:text-slate-600"
      >
        <h2 class="text-2xl font-bold">Article</h2>

        <p>
          This paragraph is styled from the parent.
          <a href="#">Read more</a>
        </p>

        <p>Every paragraph receives the same nested selector styles.</p>
      </article>

      <!-- Arbitrary state selector. -->
      <button
        data-active
        class="mt-8 rounded-lg bg-slate-200 px-5 py-3 [&[data-active]]:bg-blue-600 [&[data-active]]:text-white"
      >
        Data Active
      </button>
    </main>
  </body>
</html>
