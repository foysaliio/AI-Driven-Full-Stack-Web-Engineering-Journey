<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Focus Visible</title>
  </head>

  <body class="min-h-screen bg-slate-950 p-6 text-white">
    <main class="mx-auto max-w-3xl">
      <h1 class="text-3xl font-bold">Accessible Focus States</h1>

      <p class="mt-3 text-slate-300">
        Use the Tab key to navigate between these controls.
      </p>

      <div class="mt-8 flex flex-wrap gap-4">
        <!-- focus-visible is especially useful for keyboard focus indicators. -->
        <button
          class="rounded-lg bg-blue-600 px-5 py-3 font-semibold outline-none focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-cyan-400"
        >
          Save Changes
        </button>

        <a
          href="#content"
          class="rounded-lg border border-white/20 px-5 py-3 focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-cyan-400"
        >
          Skip to Content
        </a>
      </div>

      <!-- focus-within styles the parent when a child receives focus. -->
      <div
        class="mt-10 rounded-xl border border-slate-700 bg-slate-900 p-4 transition focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10"
      >
        <label for="username" class="text-sm text-slate-300"> Username </label>

        <input
          id="username"
          class="mt-2 w-full bg-transparent text-white outline-none"
          placeholder="Enter username"
        />
      </div>
    </main>
  </body>
</html>
