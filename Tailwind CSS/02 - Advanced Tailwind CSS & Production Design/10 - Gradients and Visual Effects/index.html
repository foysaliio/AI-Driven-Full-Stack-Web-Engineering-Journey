<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Gradients and Visual Effects</title>
  </head>

  <body class="min-h-screen bg-slate-950 p-6 text-white">
    <main class="mx-auto max-w-5xl space-y-8">
      <!-- Tailwind v4 linear gradient syntax. -->
      <div
        class="rounded-2xl bg-linear-to-r from-blue-600 via-purple-600 to-pink-600 p-10"
      >
        <h1 class="text-4xl font-bold">Linear Gradient</h1>
      </div>

      <!-- Radial gradient. -->
      <div
        class="rounded-2xl bg-radial from-blue-500 via-slate-900 to-slate-950 p-10"
      >
        Radial Gradient
      </div>

      <!-- Glass-like effect. -->
      <section
        class="relative overflow-hidden rounded-3xl bg-linear-to-br from-blue-700 to-purple-900 p-10"
      >
        <div
          class="absolute -right-16 -top-16 size-64 rounded-full bg-pink-500/40 blur-3xl"
        ></div>

        <article
          class="relative rounded-2xl border border-white/20 bg-white/10 p-8 shadow-2xl backdrop-blur-xl"
        >
          <h2 class="text-2xl font-bold">Glass Surface</h2>

          <p class="mt-3 text-white/70">
            Opacity, backdrop blur, borders, shadows, and gradients can be
            combined carefully.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
