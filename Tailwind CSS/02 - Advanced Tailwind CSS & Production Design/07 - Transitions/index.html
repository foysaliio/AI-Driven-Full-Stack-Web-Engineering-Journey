<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Transitions</title>
  </head>

  <body class="min-h-screen bg-slate-100 p-6">
    <main class="mx-auto max-w-4xl">
      <h1 class="text-3xl font-bold">Transitions</h1>

      <div class="mt-8 flex flex-wrap gap-5">
        <button
          class="rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition-colors duration-300 hover:bg-purple-600"
        >
          Color Transition
        </button>

        <button
          class="rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white transition-transform duration-300 ease-out hover:-translate-y-1 hover:scale-105"
        >
          Transform Transition
        </button>

        <button
          class="rounded-lg bg-white px-5 py-3 font-semibold shadow-sm transition-shadow duration-300 hover:shadow-xl"
        >
          Shadow Transition
        </button>
      </div>

      <article
        class="mt-10 max-w-sm rounded-2xl bg-white p-6 shadow-md transition duration-300 ease-out hover:-translate-y-2 hover:shadow-2xl"
      >
        <h2 class="text-xl font-bold">Interactive Card</h2>

        <p class="mt-2 text-slate-600">
          Smooth transitions make state changes feel intentional.
        </p>
      </article>
    </main>
  </body>
</html>
