<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Override dark mode so the .dark class controls it manually. -->
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>

    <title>Dark Mode</title>
  </head>

  <body
    class="min-h-screen bg-slate-100 p-6 text-slate-900 transition-colors dark:bg-slate-950 dark:text-white"
  >
    <main class="mx-auto max-w-4xl">
      <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold">Dark Mode</h1>

        <button
          id="themeToggle"
          class="rounded-lg bg-slate-900 px-4 py-2 text-white dark:bg-white dark:text-slate-900"
        >
          Toggle Theme
        </button>
      </div>

      <article
        class="mt-8 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900"
      >
        <h2 class="text-2xl font-bold text-slate-950 dark:text-white">
          Theme-aware Card
        </h2>

        <p class="mt-3 leading-7 text-slate-600 dark:text-slate-400">
          The same component provides separate light and dark theme styles.
        </p>
      </article>
    </main>

    <script>
      const themeToggle = document.querySelector("#themeToggle");

      themeToggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
      });
    </script>
  </body>
</html>
